<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>站点源 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">站点源</h1>
      <div class="骨">传感站登记目录 · 固件门禁：低版本探头灯红，现行入栏只收达标固件集。</div>
    </header>

    <section class="卷">
      <h2>固件门禁对账</h2>
      <div id="固件门禁"></div>
      <div class="工具 上距12">
        <input id="探头站" placeholder="站点键" style="max-width:160px"/>
        <input id="探头固件" placeholder="固件版本 如 1.0.0" style="max-width:160px"/>
        <button class="按钮" id="登记探头">登记探头固件</button>
        <input id="最低版本" placeholder="抬高最低版本 如 1.3.0" style="max-width:160px"/>
        <button class="按钮 次" id="抬升白名单">抬升白名单</button>
      </div>
      <pre class="回执" id="门禁回执">登记低版本探头后灌夹具可复现。</pre>
    </section>

    <section class="卷">
      <h2>站点目录</h2>
      <div class="表绕"><table><thead><tr><th>源键</th><th>名称</th><th>介质</th><th>区域</th><th>说明</th></tr></thead><tbody id="表"></tbody></table></div>
    </section>
    <script>
    (async () => {
      const rows = await 探栏.getJSON("/api/站点源");
      const tb = document.getElementById("表");
      for (const r of rows) {
        tb.appendChild(探栏.行(`<td>${探栏.安全文本(r.源键)}</td><td>${探栏.安全文本(r.名称)}</td><td>${探栏.安全文本(r.介质)}</td><td>${探栏.安全文本(r.区域)}</td><td>${探栏.安全文本(r.说明)}</td>`));
      }
      await 刷门禁();
    })();
    async function 刷门禁() {
      const 账 = await 探栏.getJSON("/api/固件门禁/站点源对账");
      探栏.渲染固件门禁(document.getElementById("固件门禁"), 账);
    }
    document.getElementById("登记探头").onclick = async () => {
      const el = document.getElementById("门禁回执");
      try {
        el.textContent = JSON.stringify(await 探栏.postJSON("/api/固件门禁/探头", {
          站点键: document.getElementById("探头站").value.trim(),
          固件版本: document.getElementById("探头固件").value.trim(),
        }), null, 2);
        await 刷门禁();
      } catch (e) { el.textContent = String(e); }
    };
    document.getElementById("抬升白名单").onclick = async () => {
      const el = document.getElementById("门禁回执");
      try {
        el.textContent = JSON.stringify(await 探栏.postJSON("/api/固件门禁/白名单", {
          最低版本: document.getElementById("最低版本").value.trim(),
          备注: "站点源页抬升",
        }), null, 2);
        await 刷门禁();
      } catch (e) { el.textContent = String(e); }
    };
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" >栏贯验</a>
    <a href="/站点源.html" class="亮">站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
